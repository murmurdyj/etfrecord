<style>
:root{
  --bg:#E6F3FC;--paper:#FFFFFF;--ink:#24364A;--ink2:#4A6A88;--ink3:#8AA2B8;--line:#D6E8F5;--line2:#B9D6EC;
  --up:#D64C5B;--upbg:#FDEBEE;--down:#2A967A;--downbg:#E2F5EE;--amber:#7A5E10;--amberbg:#FFF6D6;
  --accent:#2F6FA3;--accentbg:#DDEFFB;--chip:#EEF6FC;--blue:#2F6FA3;--bluebg:#DDEFFB;--btnink:#FFFFFF;
  --lav:#6A55A3;--lavbg:#EFE8FB;--tabbg:#CFE7F7;--btnline:#9CC6E6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17151F;--paper:#221F2D;--ink:#F1EEF8;--ink2:#BDB6D1;--ink3:#8E87A7;--line:#363050;--line2:#4A4366;
  --up:#FF8592;--upbg:#41222B;--down:#62D3AE;--downbg:#193B32;--amber:#F2D274;--amberbg:#3A3220;
  --accent:#D9CCFF;--accentbg:#352B5C;--chip:#2E2944;--blue:#A5D8F5;--bluebg:#1E3547;--btnink:#17151F;
  --lav:#D9CCFF;--lavbg:#352B5C;--tabbg:#26222F;--btnline:#D9CCFF;}}
:root[data-theme="dark"]{
  --bg:#17151F;--paper:#221F2D;--ink:#F1EEF8;--ink2:#BDB6D1;--ink3:#8E87A7;--line:#363050;--line2:#4A4366;
  --up:#FF8592;--upbg:#41222B;--down:#62D3AE;--downbg:#193B32;--amber:#F2D274;--amberbg:#3A3220;
  --accent:#D9CCFF;--accentbg:#352B5C;--chip:#2E2944;--blue:#A5D8F5;--bluebg:#1E3547;--btnink:#17151F;
  --lav:#D9CCFF;--lavbg:#352B5C;--tabbg:#26222F;--btnline:#D9CCFF;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.num b,.sum .v,.pl b,.lv b{font-family:"Nunito","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
h1 .dots{display:inline-flex;gap:4px}h1 .dots i{width:9px;height:9px;border-radius:50%;display:block}
.hrow{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.thm{border:1.5px solid var(--btnline);background:var(--paper);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--tabbg);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:500;padding:8px 0;border-radius:999px;cursor:pointer;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--btnink);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1.5px solid var(--btnline);color:var(--ink);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--btnink);font-weight:700}
.btn.ghost{border-color:transparent!important;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--up)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.panel h2{font-size:16px;font-weight:700;margin:0 0 10px}
.muted{color:var(--ink3);font-size:12px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  if(!S||!S.settings)S=JSON.parse(JSON.stringify(DEFAULT));

  if(!S.v||S.v<2){
    D.holdings.forEach(d=>{const h=S.holdings.find(x=>x.code===d.code);
      if(!h){if(d.code==='0056'||d.code==='00878')S.holdings.push(d);return}
      ['months','div','divYr','reinvest'].forEach(k=>{if(h[k]===undefined)h[k]=d[k]})});
    if(!S.plans)S.plans=D.plans;
    if(!S.watch.some(w=>w.code==='00878'))S.watch.splice(2,0,D.watch.find(w=>w.code==='00878'));
    S.v=2;save()}
  if(S.v<3){const fill={'0050':{months:[1,7],div:1},'2330':{months:[3,6,9,12],div:7}};

  S.holdings.forEach(h=>{h.months=h.months||[];h.div=+h.div||0;h.divYr=+h.divYr||0;h.reinvest=!!h.reinvest});
  if(S.v<4){if(!S.us)S.us=D.us;if(S.settings.fx===undefined)S.settings.fx=0;S.v=4;save()}
  if(S.v<5){const s=S.settings;if(s.usDca===undefined)s.usDca=0.1;if(s.usEtf===undefined)s.usEtf=3;if(s.usRate===undefined)s.usRate=0.0008;
    S.holdings.forEach(h=>{if(!h.ann){h.ann={};if(h.code==='2330')h.ann={12:7};if(h.code==='0056')h.ann={10:1.72}}});S.v=5;save()}

const r2=x=>Math.round(x*100)/100;

const nowStamp=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())};
function tickOf(p,etf){if(etf)return p<50?0.01:0.05;return p<10?0.01:p<50?0.05:p<100?0.1:p<500?0.5:p<1000?1:5}
function floorTick(p,etf){const t=tickOf(p,etf);return r2(Math.floor(p/t+1e-9)*t)}
function upTick(p,etf){return r2(p+tickOf(p,etf))}
function downTick(p,etf){return r2(p-tickOf(p-1e-9,etf))}
function pfmt(p,etf){const t=tickOf(p,etf);return t>=1?String(Math.round(p)):t>=0.1?p.toFixed(1):p.toFixed(2)}
const fee=a=>a>0?Math.max(Math.round(a*S.settings.rate),S.settings.minFee):0;
const taxR=etf=>etf?0.001:0.003;
const net=(q,p,etf)=>{const a=q*p;return a-fee(a)-Math.round(a*taxR(etf))};
function solve(target,q,etf){if(!(q>0)||!(target>0))return null;
  let p=target/(q*(1-S.settings.rate-taxR(etf)));if(!(p>0))return null;p=floorTick(Math.max(p,0.01),etf);let i=0;
  while(p>0.01&&net(q,downTick(p,etf),etf)>=target&&i++<4000)p=downTick(p,etf);
  i=0;while(net(q,p,etf)<target&&i++<8000)p=upTick(p,etf);return p}
function lotCost(l){const a=l.shares*l.price;if(l.kind==='init')return a;if(l.kind==='dca')return a+S.settings.dcaFee;return a+fee(a)}
function hStats(h){const etf=isETF(h.type);let q=0,c=0,real=0;const rl={};
  h.lots.map((l,i)=>({l,i})).sort((a,b)=>String(a.l.date||'').localeCompare(String(b.l.date||''))||a.i-b.i).forEach(({l})=>{
    if(l.kind==='sell'){const s=Math.min(+l.shares||0,q);if(s>0){const avg=c/q,a=s*l.price,n=a-fee(a)-Math.round(a*taxR(etf));rl[l.id]=n-avg*s;real+=n-avg*s;c-=avg*s;q-=s}else rl[l.id]=0}
    else{q+=+l.shares||0;c+=lotCost(l)}});
  if(q<1e-9){q=0;c=0}

  const lo=Math.min(...pts),hi=Math.max(...pts),pad=(hi-lo)*0.12||hi*0.02,a=lo-pad,b=hi+pad,x=v=>((v-a)/(b-a)*100).toFixed(1)+'%';

function renderHold(){

function calcBuy(w,budget,loss,profit){const etf=isETF(w.type),p=+w.price;if(!(p>0))return null;
  let q=Math.floor(budget/p);while(q>0&&q*p+fee(q*p)>budget)q--;if(q<1)return{q:0};
  const a=q*p,c=a+fee(a);return{q,a,c,etf,stop:loss>0?solve(c-loss,q,etf):null,be:solve(c,q,etf),tp:profit>0?solve(c+profit,q,etf):null}}

function findData(o,dep){if(o==null||dep>8)return null;if(typeof o==='string'){const s=o.trim();if(!s)return null;try{return findData(JSON.parse(s),dep+1)}catch(e){const i=s.indexOf('{'),j=s.lastIndexOf('}');if(i>=0&&j>i&&dep<2){try{return findData(JSON.parse(s.slice(i,j+1)),dep+1)}catch(x){}}return null}}
  if(typeof o!=='object')return null;if(o.settings&&Array.isArray(o.holdings))return o;for(const k in o){const r=findData(o[k],dep+1);if(r)return r}return null}

app.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-id]')){d.open?openSet.add(d.dataset.id):openSet.delete(d.dataset.id);
  if(d.dataset.id==='sec-plan'){const sm=d.querySelector('summary');if(sm)sm.textContent=(d.open?'收合':'展開')+'扣款明細（'+S.plans.length+' 筆）▾'}}},true);
document.getElementById('thm').addEventListener('click',()=>{const o=['auto','light','dark'],t=(S.settings.theme)||'auto';S.settings.theme=o[(o.indexOf(t)+1)%3];save();applyTheme();toast('外觀：'+THM[S.settings.theme])});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='q-code'){const g=document.getElementById('q-go'),v=t.value.trim().toUpperCase();if(g)g.href=v?'https://tw.stock.yahoo.com/quote/'+encodeURIComponent(v):'https://tw.stock.yahoo.com/'}if(t.dataset&&t.dataset.look)lookup(t.dataset.look,t.value)});
app.addEventListener('click',e=>{if(e.target.closest('summary input,summary button'))e.preventDefault()},true);
const H=id=>S.holdings.find(h=>h.id===id),W=id=>S.watch.find(w=>w.id===id);
app.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='cbudget'||f==='closs'||f==='cprofit'){const k={cbudget:'budget',closs:'maxLoss',cprofit:'profit'}[f];S.calc[k]=Math.max(0,+t.value||0);save();document.getElementById('buycards').innerHTML=renderBuyCards()}
  if(f==='ratio'){S.ratio=+t.value;save();const y=window.scrollY;document.getElementById('buycards').innerHTML=renderBuyCards();window.scrollTo(0,y);
    const r=document.querySelector('[data-f="ratio"]');if(r)r.focus()}});
app.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const v=t.value;if(['srate','smin','sdca','susdca','susetf','susrate'].includes(f))toast('已儲存');
  if(f.startsWith('lot')){const h=H(t.dataset.h),l=h&&h.lots.find(x=>x.id===t.dataset.l);if(!l)return;const n=+v;if(!(n>0)){t.value=f==='lotq'?l.shares:l.price;return}if(f==='lotq')l.shares=n;else l.price=n}
  else if(['bq','bc','bv','bd'].includes(f)){const h=H(t.dataset.h);if(!h)return;h[f]=Math.max(0,+v||0);h.btime=nowStamp();
    if(+h.bq>0&&+h.bv>0){const e=isETF(h.type),p=floorTick(+h.bv/(+h.bq*(1-S.settings.rate-taxR(e))),e);if(p>0){h.price=p;h.time=h.btime}}toast('已儲存')}
  else if(f.startsWith('h')){const h=H(t.dataset.h);if(!h)return;
    if(f==='hprice'){if(!(+v>0)){t.value=h.price;return}h.price=+v;h.time=nowStamp();const w=S.watch.find(x=>x.code===h.code);if(w){w.price=h.price;w.time=h.time}}
    else if(f==='hloss')h.maxLoss=Math.max(0,+v||0);else if(f==='hprofit')h.profit=Math.max(0,+v||0);
    else if(f==='hlong')h.longTerm=t.checked;else if(f==='hsec')h.sector=v.trim()||'其他';else if(f==='htsmc')h.tsmc=Math.min(100,Math.max(0,+v||0));else if(f==='hplan')h.plan=v.trim();
    else if(f==='hmonths')h.months=v.split(/[,，、\s]+/).map(Number).filter(n=>n>=1&&n<=12);else if(f==='hdiv')h.div=Math.max(0,+v||0);else if(f==='hdivyr')h.divYr=Math.max(0,+v||0);else if(f==='hreinv')h.reinvest=t.checked;
    else if(f==='hannm'||f==='hannv'){const mm=f==='hannm'?Math.round(+v||0):+(Object.keys(h.ann)[0]||0),vv=f==='hannv'?+v||0:+(Object.values(h.ann)[0]||0);h.ann={};if(mm>=1&&mm<=12&&vv>0)h.ann[mm]=vv}toast('已儲存')}
  else if(f==='pamt'||f==='pday'){const p=S.plans.find(x=>x.id===t.dataset.p);if(!p)return;if(f==='pamt'){if(!(+v>0)){t.value=p.amount;return}p.amount=+v}else p.day=Math.min(31,Math.max(0,Math.round(+v||0)));toast('已儲存')}
  else if(f==='wprice'){const w=W(t.dataset.w);if(!w)return;if(!(+v>0)){t.value=w.price;return}w.price=+v;w.time=nowStamp();const h=S.holdings.find(x=>x.code===w.code);if(h){h.price=w.price;h.time=w.time}
    save();const y=window.scrollY;document.getElementById('buycards').innerHTML=renderBuyCards();window.scrollTo(0,y);return}
  else if(f==='ufx'){S.settings.fx=Math.max(0,+v||0);toast('已儲存')}
  else if(f[0]==='u'&&t.dataset.u){const u=S.us.find(x=>x.id===t.dataset.u);if(!u)return;
    if(f==='ucost'||f==='uval'){if(!(+v>=0)){t.value=f==='ucost'?u.cost:u.value;return}if(f==='ucost')u.cost=+v;else u.value=+v;u.time=nowStamp()}
    else if(f==='ushares')u.shares=Math.max(0,+v||0);else if(f==='uplan')u.plan=v.trim();else if(f==='usec')u.sector=v.trim()||'美股';toast('已儲存')}
  else if(f==='srate'){const n=+v;if(n>0&&n<1)S.settings.rate=n/100}else if(f==='smin')S.settings.minFee=Math.max(0,+v||0);else if(f==='sdca')S.settings.dcaFee=Math.max(0,+v||0);
  else if(f==='susdca')S.settings.usDca=Math.max(0,+v||0);else if(f==='susetf')S.settings.usEtf=Math.max(0,+v||0);else if(f==='susrate'){const n=+v;if(n>=0&&n<5)S.settings.usRate=n/100}
  else return;
  save();const y=window.scrollY;render();window.scrollTo(0,y)});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='addlot'){const id=b.dataset.h,h=H(id),q=+document.getElementById('nq-'+id).value,p=+document.getElementById('np-'+id).value,err=document.getElementById('err-'+id);
    if(!(q>0)||!(p>0)){err.textContent='請輸入股數和成交價';err.style.color='var(--up)';return}
    h.lots.push({id:uid(),date:document.getElementById('nd-'+id).value,shares:q,price:p,kind:document.getElementById('nk-'+id).value});openSet.add(id)}
  else if(a==='dellot'){const h=H(b.dataset.h);if(h.lots.length<=1&&!confirm('刪除最後一筆紀錄嗎？'))return;h.lots=h.lots.filter(l=>l.id!==b.dataset.l)}
  else if(a==='delh'){const h=H(b.dataset.h);if(!confirm('刪除 '+h.name+' 和所有買進紀錄嗎？'))return;S.holdings=S.holdings.filter(x=>x.id!==h.id)}
  else if(a==='addh'){const c=document.getElementById('ah-code').value.trim(),n=document.getElementById('ah-name').value.trim(),p=+document.getElementById('ah-price').value,ty=document.getElementById('ah-type').value,err=document.getElementById('ah-err');
    if(!c||!n||!(p>0)){err.textContent='請填代號、名稱和現價';err.style.color='var(--up)';return}
    const id=uid(),lt=document.getElementById('ah-cat').value==='dca';S.holdings.push({id,code:c,name:n,type:ty,sector:(document.getElementById('ah-sec').value.trim()||'其他'),price:p,time:nowStamp(),longTerm:lt,maxLoss:0,profit:0,tsmc:0,plan:'',lots:[],months:[],div:0,divYr:0,ann:{},reinvest:false});openSet.add(id)}
  else if(a==='addw'){const c=document.getElementById('aw-code').value.trim(),n=document.getElementById('aw-name').value.trim(),p=+document.getElementById('aw-price').value,ty=document.getElementById('aw-type').value,sc=document.getElementById('aw-sec').value.trim()||'其他',err=document.getElementById('aw-err');
    if(!c||!n||!(p>0)){err.textContent='請填代號、名稱和現價';err.style.color='var(--up)';return}
    S.watch.push({id:uid(),code:c,name:n,type:ty,sector:sc,price:p,time:nowStamp()})}
  else if(a==='addplan'){const c=document.getElementById('ap-code').value.trim(),n=document.getElementById('ap-name').value.trim(),am=+document.getElementById('ap-amt').value,err=document.getElementById('ap-err');
    if(!c||!n||!(am>0)){err.textContent='請填代號、名稱和金額';err.style.color='var(--up)';return}
    S.plans.push({id:uid(),code:c.toUpperCase(),name:n,amount:am,cur:document.getElementById('ap-cur').value,day:Math.min(31,Math.max(0,+document.getElementById('ap-day').value||0))})}
  else if(a==='delplan'){if(!confirm('刪除這筆扣款計畫嗎？'))return;S.plans=S.plans.filter(p=>p.id!==b.dataset.p)}
  else if(a==='sell'){const id=b.dataset.h,h=H(id),st=hStats(h),q=+document.getElementById('sq-'+id).value,p=+document.getElementById('sp-'+id).value,err=document.getElementById('serr-'+id);
    if(!(q>0)||!(p>0)){err.textContent='請輸入賣出股數和賣出價';err.style.color='var(--up)';return}
    if(q>st.q+1e-9){err.textContent='賣出股數不能超過目前的 '+st.q+' 股';err.style.color='var(--up)';return}
    h.lots.push({id:uid(),date:document.getElementById('sd-'+id).value,shares:q,price:p,kind:'sell'});openSet.add(id)}
  else if(a==='sellall'){const id=b.dataset.h;document.getElementById('sq-'+id).value=hStats(H(id)).q;return}
  else if(a==='pairclose'){S.pair=[]}
  else if(a==='export'){const m=document.getElementById('ex-msg');m.style.color='';m.textContent='準備中…';
    (async()=>{let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(x){dl=null}
      const d=new Date(),p=n=>String(n).padStart(2,'0'),fn='台股試算備份-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
      if(!dl){try{const bl=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);m.textContent='已匯出'}catch(x){m.textContent='無法下載檔案，請改用下方的複製文字備份'}return}
      try{await dl.save({filename:fn,data:JSON.stringify(S,null,2)});m.textContent='已匯出'}
      catch(x){m.textContent=x&&x.code==='declined'?'已取消匯出':x&&x.code==='rate_limited'?'稍等一下再試一次':'無法匯出，請改用複製文字備份';}})();return}
  else if(a==='savediv'){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();save();toast('已儲存');return}
  else if(a==='addus'){const c=document.getElementById('au-code').value.trim(),n=document.getElementById('au-name').value.trim(),co=+document.getElementById('au-cost').value,va=+document.getElementById('au-val').value,err=document.getElementById('au-err');
    if(!c||!n||!(co>=0)||!(va>=0)||document.getElementById('au-cost').value===''){err.textContent='請填代號、名稱、總成本和現值';err.style.color='var(--up)';return}
    S.us.push({id:uid(),code:c.toUpperCase(),name:n,sector:((USDB[c.toUpperCase()]||[])[1]||'美股'),cost:co,value:va,shares:0,time:nowStamp(),plan:''})}
  else if(a==='delus'){if(!confirm('刪除這檔美股紀錄嗎？'))return;S.us=S.us.filter(u=>u.id!==b.dataset.u)}
  else if(a==='ov'){S.settings.ovUS=b.dataset.v==='1';toast(S.settings.ovUS?'總覽改為台股＋美股':'總覽改為只看台股')}
  else if(a==='recon'){reconOpen=!reconOpen;if(reconOpen){render();const r=document.getElementById('recon');if(r&&r.scrollIntoView)r.scrollIntoView({behavior:'smooth',block:'start'});return}}
  else if(a==='reconsave'){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();reconOpen=false;toast('已儲存');save();render();window.scrollTo(0,0);return}
  else if(a==='chatsave'){const v=(document.getElementById('chat-url').value||'').trim(),err=document.getElementById('chat-err');
    if(!/^https:\/\/(www\.)?claude\.ai\//.test(v)){err.textContent='請貼上 https://claude.ai/ 開頭的對話連結';err.style.color='var(--up)';return}
    S.settings.chatUrl=v;toast('已儲存')}
  else if(a==='chatclear'){S.settings.chatUrl='';}
  else if(a==='delw'){S.watch=S.watch.filter(w=>w.id!==b.dataset.w);S.pair=S.pair.filter(x=>x!==b.dataset.w)}
  else if(a==='pair'){const id=b.dataset.w;if(S.pair.includes(id))S.pair=S.pair.filter(x=>x!==id);else{S.pair.push(id);if(S.pair.length>2)S.pair.shift()}}
  else if(a==='copy'){const t=document.getElementById('bk');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{document.getElementById('cp-msg').textContent='已複製'}).catch(()=>{document.getElementById('cp-msg').textContent=ok?'已複製':'請長按文字框手動複製'});else document.getElementById('cp-msg').textContent=ok?'已複製':'請長按文字框手動複製';return}
  else if(a==='restore'){const m=document.getElementById('rs-msg');try{const d=findData(document.getElementById('rs').value,0);if(!d)throw 0;S=d;S.pair=S.pair||[];S.ratio=S.ratio||50;migrate();m.textContent='已還原'}catch(x){m.textContent='備份文字格式不對，請確認是完整複製的內容';m.style.color='var(--up)';return}}
  else if(a==='reset'){if(!confirm('確定重設？目前資料會被清除。'))return;S=JSON.parse(JSON.stringify(DEFAULT))}
  else return;
  save();const y=window.scrollY;render();window.scrollTo(0,y)});
app.addEventListener('change',e=>{if(e.target.id!=='imf')return;const f=e.target.files&&e.target.files[0],m=document.getElementById('im-msg');if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=findData(r.result,0);if(!d)throw 0;
    if(!confirm('用備份檔取代目前資料嗎？'))return;S=d;S.pair=S.pair||[];S.ratio=S.ratio||50;migrate();save();render();const m2=document.getElementById('im-msg');if(m2)m2.textContent='已還原'}
    catch(x){m.textContent='這不是正確的備份檔，請選擇之前匯出的 .json 檔';m.style.color='var(--up)'}};r.readAsText(f)});
applyTheme();render();
</script>
